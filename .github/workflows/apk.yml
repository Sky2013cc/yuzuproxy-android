name: build-apk

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c
  # 只允许把 APK 传到 static/，权限有限；要换就改这个值和服务器上的 meta.build_upload_key
  UP_KEY: 'cUKg87ogmIEz6sVpygO0zLk4Vfvbsq8u'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Android signing config
        run: |
          printf 'keyAlias=yuzuproxy\nstorePassword=YuzuProxy2026!\nkeyPassword=YuzuProxy2026!\n' >> android/local.properties
          echo 'sdk.dir='"$ANDROID_SDK_ROOT" >> android/local.properties
          cat android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Fetch CA bundle
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          mkdir -p "$(dirname "$bundle")"
          curl -fsSL --retry 3 -o "$bundle" https://curl.se/ca/cacert-2026-09-25.pem || echo 'skip ca bundle'

      - name: Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build APK
        run: dart setup.dart android --env stable -v

      - name: Show output
        run: ls -la dist/ || true

      - name: Upload APK to yuzucloud
        run: |
          set -e
          found=0
          for f in dist/*.apk dist/**/*.apk; do
            [ -f "$f" ] || continue
            found=1
            echo "uploading $f"
            curl -fsS -X POST "https://yuzucloud.xyz/yuzuproxy/api/build-upload" \
              -H "X-Build-Key: $UP_KEY" \
              -F "file=@$f;filename=YuzuProxy-android.apk"
            echo
          done
          if [ "$found" = "0" ]; then
            echo "no apk produced"; exit 1
          fi

      - name: Keep artifact as backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuzuproxy-apk
          path: dist
          if-no-files-found: ignore
          overwrite: true
